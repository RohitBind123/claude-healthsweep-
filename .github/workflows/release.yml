name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Tag must match package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$TAG" ]; then echo "::error::tag $TAG but package.json is $pkg"; exit 1; fi
      - run: npm run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Extract release notes from CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md
          if ! grep -q '[^[:space:]]' RELEASE_NOTES.md; then
            echo "::error::No CHANGELOG.md section for [$version]"
            exit 1
          fi
          cat RELEASE_NOTES.md
      - name: Pack the npm tarball
        run: npm pack --ignore-scripts
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: RELEASE_NOTES.md
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
          files: healthsweep-*.tgz

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing (OIDC); also signs provenance
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - name: Install an npm that supports Trusted Publishing
        run: npm install -g npm@11.21.0
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          if npm view "healthsweep@$version" version >/dev/null 2>&1; then
            echo "::notice::healthsweep@$version is already on npm; nothing to publish"
            exit 0
          fi
          # No token: npm exchanges this job's GitHub OIDC token for a short-lived publish token.
          # The package's Trusted Publisher on npmjs.com must name this repository and release.yml.
          npm publish --access public --ignore-scripts
